services:
  backend:
    build: 
      context: .
    container_name: ai_code_reviewer_backend
    ports:
      - "8000:8000"
    volumes:
      # Persists the uploaded files and generated Markdown reports
      - ./data:/app/data
    env_file:
      # Loads your LLM API keys into the container
      - .env
    environment:
      # Directs traces to the local Phoenix container
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
    depends_on:
      - phoenix
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai_code_reviewer_frontend
    ports:
      # Maps your computer's port 3000 to the container's Nginx port 80
      - "3000:80"
    depends_on:
      # Ensures the API starts before the web interface
      - backend
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: arize_phoenix
    ports:
      - "6006:6006" # UI and API
      - "4317:4317" # OTLP gRPC receiver
    restart: unless-stopped